# Manual fallback to bump the Homebrew cask on the tap repo
# (honeyhive-ai/homebrew-hive) to a given tag's version + DMG sha256.
#
# The automatic bump on every release lives in release.yml's `cask` job (it runs
# in the tag's context after the DMG is uploaded). A `release: published` trigger
# does NOT work here: releases created by tauri-action use GITHUB_TOKEN, and
# GitHub does not fire the `release` event for GITHUB_TOKEN-created releases. So
# this workflow is dispatch-only — use it to re-bump a past release by hand.
#
# Needs HOMEBREW_TAP_TOKEN: a fine-grained PAT with Contents:write on
# honeyhive-ai/homebrew-hive (the default GITHUB_TOKEN can't push cross-repo).
name: Update Homebrew cask (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.2)"
        required: true

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Bump the cask on the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping cask update."
            exit 0
          fi
          VERSION="${TAG#v}"
          DMG="Hive_${VERSION}_aarch64.dmg"
          echo "Fetching $DMG to hash it…"
          curl -fsSL --retry 5 --retry-delay 10 -o hive.dmg \
            "https://github.com/honeyhive-ai/hive/releases/download/${TAG}/${DMG}"
          SHA=$(shasum -a 256 hive.dmg | awk '{print $1}')
          echo "sha256=$SHA"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/honeyhive-ai/homebrew-hive.git" tap
          cd tap
          sed -i '' -E "s/version \"[^\"]*\"/version \"${VERSION}\"/" Casks/hive.rb
          sed -i '' -E "s/sha256 \"[^\"]*\"/sha256 \"${SHA}\"/" Casks/hive.rb
          git config user.name "hive-release-bot"
          git config user.email "release@apiaryhq.ai"
          if git commit -am "hive ${VERSION}"; then
            git push origin HEAD
            echo "Cask bumped to ${VERSION}."
          else
            echo "Cask already at ${VERSION} — nothing to do."
          fi
