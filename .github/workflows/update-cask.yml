# When a release is published, bump the Homebrew cask on the tap repo
# (honeyhive-ai/homebrew-hive) to the new version + DMG sha256, so
# `brew install/upgrade --cask hive` tracks releases with no manual edits.
#
# Inert until HOMEBREW_TAP_TOKEN exists: a fine-grained PAT with Contents:write
# on honeyhive-ai/homebrew-hive (the default GITHUB_TOKEN can't push cross-repo).
name: Update Homebrew cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.1)"
        required: true

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Bump the cask on the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping cask update."
            exit 0
          fi
          VERSION="${TAG#v}"
          DMG="Hive_${VERSION}_aarch64.dmg"
          echo "Fetching $DMG to hash it…"
          curl -fsSL --retry 5 --retry-delay 10 -o hive.dmg \
            "https://github.com/honeyhive-ai/hive/releases/download/${TAG}/${DMG}"
          SHA=$(shasum -a 256 hive.dmg | awk '{print $1}')
          echo "sha256=$SHA"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/honeyhive-ai/homebrew-hive.git" tap
          cd tap
          sed -i '' -E "s/version \"[^\"]*\"/version \"${VERSION}\"/" Casks/hive.rb
          sed -i '' -E "s/sha256 \"[^\"]*\"/sha256 \"${SHA}\"/" Casks/hive.rb
          git config user.name "hive-release-bot"
          git config user.email "release@apiaryhq.ai"
          if git commit -am "hive ${VERSION}"; then
            git push origin HEAD
            echo "Cask bumped to ${VERSION}."
          else
            echo "Cask already at ${VERSION} — nothing to do."
          fi
