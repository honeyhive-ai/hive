[package]
name = "hive-tunnel-check"
version = "0.1.0"
edition = "2021"

# Standalone: not a member of the hive workspace.
[workspace]

[dependencies]
snow = "0.9"
serde_json = "1"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
hkdf = "0.12"
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
