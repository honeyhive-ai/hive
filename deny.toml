# cargo-deny configuration — the dependency-security gate for the Rust workspace.
# Run locally with `cargo deny check`; CI runs it via .github/workflows/security-audit.yml.

[advisories]
version = 2
# Fail on any RUSTSEC advisory (vulnerability) or a yanked crate. `unmaintained`
# is a warning so an advisory-DB flag doesn't block a release on its own.
yanked = "deny"
unmaintained = "warn"
ignore = []

[licenses]
version = 2
# Permissive licenses only — matches the current dependency tree. Add a license
# here (with justification) if a new dep legitimately needs it, rather than
# lowering the bar. cargo-deny accepts an SPDX expression if ANY branch is allowed.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
# Surface (but don't block on) duplicate versions and wildcard version reqs.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only crates.io + in-repo path deps; no unknown registries or git sources.
unknown-registry = "deny"
unknown-git = "deny"
