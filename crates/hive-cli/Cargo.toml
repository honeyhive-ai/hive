[package]
name = "hive-cli"
version = "1.18.0"
edition.workspace = true
license.workspace = true

# A headless Hive client — connect to a relay, sync a workspace's E2EE event
# log, read/write signed events. The `hive` binary a cloud-hosted agent runs
# instead of the desktop app. Composes hive-core + hive-runtime; no Tauri.
[[bin]]
name = "hive"
path = "src/main.rs"

[dependencies]
hive-core = { path = "../hive-core" }
hive-runtime = { path = "../hive-runtime" }
anyhow.workspace = true
uuid.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
base64 = "0.21"
# `hive serve` (the home host for the iOS app): HTTP + SSE API. axum 0.7,
# reqwest 0.12, futures-util and getrandom 0.2 are already in the lockfile
# (hive-runtime's deps / dev-deps); qrcodegen is a dependency-free QR encoder
# for the pairing code.
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
getrandom = "0.2"
qrcodegen = "1.8"
tracing.workspace = true
time = { workspace = true, features = ["local-offset"] }
# Relay tunnel (`hive-tunnel/1`, docs/relay-tunnel.md): Noise IK/IKpsk1 (snow),
# Ed25519 host signing key + credentials, HKDF/SHA-256 derivations,
# ChaCha20-Poly1305 for end-to-end push, the control/accept WebSockets
# (tokio-tungstenite over rustls, ring provider like reqwest), and tower's
# oneshot to call the axum router in process.
snow = "0.9.6"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
chacha20poly1305 = "0.10"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[dev-dependencies]
tempfile = "3"
hex = "0.4"
